name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Make a signing key for this build
        run: |
          KS_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$KS_PASS"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KS_FILE=$RUNNER_TEMP/hishob.jks" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$RUNNER_TEMP/hishob.jks" -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -alias hishob -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dainandin Hishob"
      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android --no-daemon assembleRelease
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk dainandin-hishob.apk
          gh release create "v1.0.${{ github.run_number }}" dainandin-hishob.apk \
            --title "दैनंदिन हिशोब (Android) build ${{ github.run_number }}" \
            --notes "Phone मध्ये install करण्यासाठी dainandin-hishob.apk डाउनलोड करा."
