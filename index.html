<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>दैनंदिन हिशोब</title>
<meta name="description" content="रोजचा हिशोब: घेतले, दिले आणि शिल्लक.">
<meta name="theme-color" content="#1f3f9a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one narrow notebook column, balance on top, one big action, ruled lists below; fixed 4-tab bar. */
:root{
  --bg:#eef1f6; --card:#ffffff; --ink:#18233a; --muted:#5d6880; --line:#d9dfea;
  --accent:#1f3f9a; --accent-fg:#ffffff; --hero:#1f3f9a; --hero-fg:#ffffff; --hero-soft:#c9d5fb;
  --in:#12784a; --in-bg:#e2f3ea; --out:#b93a1e; --out-bg:#fbe9e3; --margin:#e9a3a3; --shade:rgba(16,24,44,.55);
  --display:"Baloo 2","Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  --body:"Mukta","Noto Sans Devanagari","Nirmala UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151f; --card:#1a2130; --ink:#e8ecf5; --muted:#9aa5bb; --line:#2c3547;
  --accent:#8ea6ff; --accent-fg:#0c1226; --hero:#263a7c; --hero-fg:#ffffff; --hero-soft:#b9c6f5;
  --in:#5fd09a; --in-bg:#153326; --out:#ff9777; --out-bg:#3a1f17; --margin:#6b3a3a; --shade:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151f; --card:#1a2130; --ink:#e8ecf5; --muted:#9aa5bb; --line:#2c3547;
  --accent:#8ea6ff; --accent-fg:#0c1226; --hero:#263a7c; --hero-fg:#ffffff; --hero-soft:#b9c6f5;
  --in:#5fd09a; --in-bg:#153326; --out:#ff9777; --out-bg:#3a1f17; --margin:#6b3a3a; --shade:rgba(0,0,0,.65); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-block:18px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:1.05rem;font-weight:700;margin:0;color:var(--muted)}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
.num{font-variant-numeric:tabular-nums}
.in{color:var(--in)} .out{color:var(--out)}

/* balance */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:18px;padding:18px 20px 16px}
.hero .lbl{color:var(--hero-soft);font-weight:600}
.hero .bal{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,12vw,3.2rem);line-height:1.1;margin:2px 0 12px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero .pair{display:flex;gap:12px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
.hero .pair div{flex:1;min-width:0}
.hero .pair span{display:block;color:var(--hero-soft);font-size:.9rem}
.hero .pair b{font-size:1.15rem;font-variant-numeric:tabular-nums}

.btn{min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{background:var(--out);border-color:var(--out);color:var(--card)}
.btn.ghost-danger{color:var(--out);border-color:var(--out);background:transparent}
.btn.big{min-height:64px;font-size:1.3rem;font-weight:700;width:100%;border-radius:16px}
.btn.wide{width:100%}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:12px 4px;min-height:44px}

.trio{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trio div:last-child{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.trio div{background:var(--card);border-radius:12px;padding:10px 12px;min-width:0}
.trio span{display:block;color:var(--muted);font-size:.9rem}
.trio b{font-size:1.15rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.block{display:flex;flex-direction:column;gap:8px}

/* recent cards */
.tx{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:12px;padding:12px 14px}
.tx .l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tx .amt{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.tx .cat{font-weight:600}
.tx .l2,.tx .l3{color:var(--muted);font-size:.95rem;overflow-wrap:anywhere}
.pill{font-size:.82rem;font-weight:700;border-radius:99px;padding:1px 10px;white-space:nowrap}
.pill.in{background:var(--in-bg)} .pill.out{background:var(--out-bg)}
.tx .pill{margin-left:auto}
.empty{background:var(--card);border-radius:12px;padding:28px 16px;text-align:center;color:var(--muted);font-size:1.1rem}
.warn{background:var(--out-bg);color:var(--out);border-radius:12px;padding:10px 14px;font-weight:600}

/* history */
.field{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);padding:6px 16px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frow label{font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.day{background:var(--card);border-radius:12px;overflow:hidden}
.day h3{margin:0;padding:10px 14px 8px 26px;font-size:1rem;font-weight:700;border-bottom:1.5px solid var(--line)}
.day .rows{border-left:2px solid var(--margin);margin-left:14px}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px 11px 10px;min-height:52px}
.hrow .why{min-width:0;overflow-wrap:anywhere;font-weight:500}
.hrow .why small{display:block;color:var(--muted);font-weight:400;font-size:.85rem}
.hrow .a{font-weight:700;font-variant-numeric:tabular-nums}
.day .net{display:flex;justify-content:space-between;gap:10px;padding:9px 14px 10px 26px;font-weight:600;font-size:.95rem;color:var(--muted)}
.day .net b{color:var(--ink);font-variant-numeric:tabular-nums}
.count{color:var(--muted);font-size:.95rem}

/* report */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:12px;padding:4px}
.mnav b{font-family:var(--display);font-size:1.25rem}
.mnav button{width:50px;height:50px;border:0;background:none;font-size:1.6rem;border-radius:10px;color:var(--accent)}
.sum{background:var(--card);border-radius:12px;padding:6px 16px}
.sum div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0}
.sum b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.bars{background:var(--card);border-radius:12px;padding:8px 16px}
.bar{padding:8px 0}
.bar .t{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.bar .t span:last-child{font-variant-numeric:tabular-nums}
.bar i{display:block;height:10px;border-radius:5px;background:var(--line);margin-top:4px;overflow:hidden}
.bar i u{display:block;height:100%;background:var(--out);border-radius:5px}
.note{background:var(--card);border-radius:12px;padding:12px 16px;font-weight:500}
.tbl{background:var(--card);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:.95rem}
th{color:var(--muted);font-weight:600}
td:nth-child(n+2),th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border:0}

/* settings */
.set{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.set p{margin:0;color:var(--muted);font-size:.95rem}
.set h2{color:var(--ink)}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:5;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);font-weight:600;font-size:.85rem}
nav button[aria-current="page"]{color:var(--accent)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* entry sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet form{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:14px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.x{width:48px;height:48px;border-radius:12px;border:0;background:var(--card);font-size:1.4rem}
.lab{font-weight:600;color:var(--muted);font-size:.95rem;display:flex;flex-direction:column;gap:4px;min-width:0}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types button{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.35rem;font-weight:700}
.types button[data-mode]{min-height:54px;font-size:1.15rem}
.types button[data-mode][aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.types button.in[aria-pressed="true"]{background:var(--in);border-color:var(--in);color:var(--card)}
.types button.out[aria-pressed="true"]{background:var(--out);border-color:var(--out);color:var(--card)}
.amtbox{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px 16px}
.amtbox span{font-family:var(--display);font-size:2rem;font-weight:700;color:var(--muted)}
.amtbox input{flex:1;min-width:0;border:0;background:none;font-family:var(--display);font-size:2.2rem;font-weight:700;min-height:60px;font-variant-numeric:tabular-nums;outline:none}
.amtbox:focus-within{border-color:var(--accent)}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:1rem}
.chk input{width:26px;height:26px;flex:none;accent-color:var(--accent);margin:0}
a{color:var(--accent);font-weight:600}
.err{color:var(--out);font-weight:700;min-height:1.4em;margin:0}

/* dialogs */
.modal{position:fixed;inset:0;background:var(--shade);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.modal p{margin:0;font-size:1.15rem;font-weight:600}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal textarea{width:100%;height:180px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:8px;font-size:.8rem;font-family:ui-monospace,monospace}
.lock{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.dots{display:flex;gap:14px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:64px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-family:var(--display);font-size:1.6rem;font-weight:700}
.pad button.nb{border:0;background:none;font-size:1.2rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:99px;font-weight:700;z-index:70;white-space:nowrap}
</style>
</head>
<body>

<div class="app">
  <section class="screen" id="s-home"></section>

  <section class="screen" id="s-list" hidden>
    <h1>हिशोब</h1>
    <input class="field" id="q" type="search" placeholder="हिशोब शोधा..." aria-label="हिशोब शोधा" autocomplete="off">
    <div class="chips" id="periods"></div>
    <div class="frow" id="custom" hidden>
      <label>पासून<input class="field" type="date" id="c-from"></label>
      <label>पर्यंत<input class="field" type="date" id="c-to"></label>
    </div>
    <div class="frow">
      <select class="field" id="f-type" aria-label="प्रकार">
        <option value="all">घेतले + दिले</option><option value="TAKEN">फक्त घेतले</option><option value="GIVEN">फक्त दिले</option>
      </select>
      <select class="field" id="f-catf" aria-label="Category"></select>
    </div>
    <div id="list" class="block" style="gap:12px"></div>
  </section>

  <section class="screen" id="s-report" hidden></section>
  <section class="screen" id="s-set" hidden></section>
</div>

<nav aria-label="मुख्य"><div>
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>होम</button>
  <button data-tab="list"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></svg>हिशोब</button>
  <button data-tab="report"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M21 20H3"/></svg>रिपोर्ट</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>सेटिंग</button>
</div></nav>

<div class="sheet" id="sheet" hidden>
  <form id="form" novalidate autocomplete="off">
    <div class="shead"><h1 id="f-title">नवीन हिशोब</h1><button type="button" class="x" data-act="close" aria-label="बंद करा">✕</button></div>
    <div class="two">
      <label class="lab">दिनांक<input class="field" type="date" id="f-date" required></label>
      <label class="lab">वार<input class="field" id="f-day" readonly tabindex="-1"></label>
    </div>
    <div class="types" role="group" aria-label="प्रकार">
      <button type="button" class="in" data-type="TAKEN" aria-pressed="false">घेतले</button>
      <button type="button" class="out" data-type="GIVEN" aria-pressed="false">दिले</button>
    </div>
    <label class="lab">रक्कम
      <div class="amtbox"><span>₹</span><input id="f-amt" inputmode="decimal" placeholder="0" aria-label="रक्कम"></div>
    </label>
    <label class="lab">कशासाठी?<input class="field" id="f-purpose" maxlength="80" placeholder="उदा. किराणा" enterkeyhint="done"></label>
    <div class="chips" id="f-chips"></div>
    <label class="lab">Category<select class="field" id="f-cat"></select></label>
    <p class="err" id="f-err" role="alert"></p>
    <button class="btn primary big" type="submit">हिशोब सेव्ह करा</button>
    <button class="btn ghost-danger wide" type="button" id="f-del" data-act="del" hidden>हटवा</button>
  </form>
</div>

<div class="sheet" id="auth" hidden>
  <form id="auth-form" novalidate>
    <div class="shead"><h1>दैनंदिन हिशोब</h1><button type="button" class="x" id="a-close" data-act="auth-close" aria-label="बंद करा">✕</button></div>
    <div class="types" role="group" aria-label="खाते">
      <button type="button" data-mode="login" aria-pressed="true">लॉगिन</button>
      <button type="button" data-mode="signup" aria-pressed="false">नवीन खाते</button>
    </div>
    <p class="sub" id="a-hint"></p>
    <button class="btn wide" type="button" id="a-google" data-act="auth-google" hidden>Google ने लॉगिन करा</button>
    <div id="a-extra" class="block" style="gap:14px" hidden>
      <label class="lab">पूर्ण नाव<input class="field" id="a-name" maxlength="80" autocomplete="name"></label>
      <label class="lab">मोबाईल नंबर<input class="field" id="a-mobile" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="10 अंकी"></label>
      <label class="lab">पत्ता<textarea class="field" id="a-addr" rows="2" maxlength="250" autocomplete="street-address"></textarea></label>
    </div>
    <label class="lab">ई-मेल<input class="field" id="a-email" type="email" autocomplete="email" inputmode="email"></label>
    <label class="lab">पासवर्ड (किमान 6 अक्षरे)<input class="field" id="a-pass" type="password" autocomplete="current-password"></label>
    <label class="chk" id="a-consent" hidden><input type="checkbox" id="a-ok"><span>मी <a href="privacy.html" target="_blank" rel="noopener">गोपनीयता धोरण</a> वाचले आहे आणि मला ते मान्य आहे.</span></label>
    <p class="err" id="a-err" role="alert"></p>
    <button class="btn primary big" type="submit" id="a-submit">लॉगिन करा</button>
    <button class="linkbtn" type="button" id="a-forgot" data-act="auth-forgot">पासवर्ड विसरलात?</button>
  </form>
</div>

<div class="modal" id="modal" hidden><div class="box" id="modal-box" role="dialog" aria-modal="true"></div></div>
<div class="lock" id="lock" hidden>
  <h1 id="lock-title">PIN टाका</h1>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <p class="err" id="lock-err" role="alert"></p>
  <div class="pad" id="pad"></div>
  <button class="linkbtn" id="lock-cancel" hidden>रद्द करा</button>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="restore" accept=".json,application/json" hidden>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script>
(async function(){
'use strict';
/* ---------- text & constants (one place, so English/Hindi can be added later) ---------- */
const CATS=['घरखर्च','किराणा','प्रवास','औषध','शिक्षण','वैयक्तिक','उसने / उधार','इतर'];
const CAT_ON={'घरखर्च':'घरखर्चावर','किराणा':'किराण्यावर','प्रवास':'प्रवासावर','औषध':'औषधांवर','शिक्षण':'शिक्षणावर','वैयक्तिक':'वैयक्तिक गोष्टींवर','उसने / उधार':'उसने / उधारीवर','इतर':'इतर गोष्टींवर'};
const MONTHS=['जानेवारी','फेब्रुवारी','मार्च','एप्रिल','मे','जून','जुलै','ऑगस्ट','सप्टेंबर','ऑक्टोबर','नोव्हेंबर','डिसेंबर'];
const DAYS=['रविवार','सोमवार','मंगळवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];
const TYPE={TAKEN:'घेतले',GIVEN:'दिले'};
const PERIODS=[['all','सर्व'],['today','आज'],['yest','काल'],['week','या आठवड्यात'],['month','हा महिना'],['last','मागचा महिना'],['custom','तारीख निवडा']];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const today=()=>iso(new Date());
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&iso(parse(s))===s;
const dayName=s=>DAYS[parse(s).getDay()];
const fmtDate=s=>{const d=parse(s);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()};
const fmtMonth=mk=>MONTHS[+mk.slice(5)-1]+' '+mk.slice(0,4);
const rupee=n=>(n<0?'−':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2});
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const shiftMonth=(mk,n)=>{const d=new Date(+mk.slice(0,4),+mk.slice(5)-1+n,1);return iso(d).slice(0,7)};
function totals(list){let i=0,o=0;for(const t of list){const p=Math.round(t.amount*100);if(t.type==='TAKEN')i+=p;else o+=p}return{tin:i/100,tout:o/100,net:(i-o)/100}}
function fmtInput(v){v=v.replace(/[^\d.]/g,'');const i=v.indexOf('.');let a=i<0?v:v.slice(0,i);const b=i<0?null:v.slice(i+1).replace(/\./g,'').slice(0,2);
  a=a.replace(/^0+(?=\d)/,'').slice(0,9);const f=a?Number(a).toLocaleString('en-IN'):'';return b===null?f:(f||'0')+'.'+b}
function hashPin(p){let h=5381;const s='bengi-hishob:'+p;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)}

/* ---------- local store ---------- */
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
let TX=[];           // all records, including deleted ones (del:1) so deletions sync
let LIVE=[];         // visible records, newest first
let localOK=true;
let dirty=new Set(); // ids changed on this phone and not yet confirmed by the server
let UID='guest',EMAIL='',PROFILE={};
const K=k=>'dh.'+k+'.'+UID;
function reindex(){LIVE=TX.filter(t=>!t.del).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.created_at<b.created_at?1:-1))}
function loadLocal(){
  TX=[];dirty=new Set();
  try{const a=JSON.parse(store.get(K('tx'))||'[]');if(Array.isArray(a))TX=a.filter(t=>t&&t.id&&t.date)}catch(e){}
  try{dirty=new Set(JSON.parse(store.get(K('dirty'))||'[]'))}catch(e){}
  reindex()}
function saveDirty(){store.set(K('dirty'),JSON.stringify([...dirty]))}
function saveLocal(){localOK=store.set(K('tx'),JSON.stringify(TX));saveDirty();return localOK}
function commit(ids){reindex();for(const i of ids)dirty.add(i);const ok=saveLocal();push();refresh();return ok||cloud==='ok'}

/* ---------- server sync (Supabase: one row per हिशोब, each person sees only their own rows) ---------- */
const CFG=window.HISHOB_CONFIG||{};
let sb=null;
try{if(CFG.url&&CFG.key&&window.supabase)sb=window.supabase.createClient(CFG.url,CFG.key)}catch(e){}
let cloud='off',pushing=false,pulling=false;
const normTs=x=>{const d=new Date(x);return isNaN(d)?new Date(0).toISOString():d.toISOString()};
const toRow=t=>({id:t.id,date:t.date,day:t.day||dayName(t.date),transaction_type:t.type,amount:t.amount,purpose:t.purpose||'',category:t.category||'',created_at:t.created_at||t.updated_at,updated_at:t.updated_at,deleted:!!t.del});
function fromRow(r){const t={id:r.id,date:r.date,day:r.day,transaction_type:r.transaction_type,type:r.transaction_type,amount:Number(r.amount),purpose:r.purpose||'',category:r.category||'',created_at:normTs(r.created_at),updated_at:normTs(r.updated_at)};if(r.deleted)t.del=1;return t}
async function push(){
  if(!sb||UID==='guest'||pushing||!dirty.size)return;
  const uid=UID,byId=new Map(TX.map(t=>[t.id,t])),rows=[];
  for(const i of dirty){const t=byId.get(i);if(t&&TYPE[t.type]&&t.amount>0)rows.push(t);else dirty.delete(i);if(rows.length>=200)break}
  if(!rows.length){saveDirty();return}
  pushing=true;let error=null;
  try{({error}=await sb.from('transactions').upsert(rows.map(toRow),{onConflict:'user_id,id'}))}catch(e){error=e}
  pushing=false;if(uid!==UID)return;
  if(error){setCloud('err');return}
  const now=new Map(TX.map(t=>[t.id,t.updated_at]));
  for(const t of rows)if(now.get(t.id)===t.updated_at)dirty.delete(t.id);
  saveDirty();setCloud('ok');if(tab==='set')refresh();
  if(dirty.size)push();
}
async function pull(){
  if(!sb||UID==='guest'||pulling)return;
  const uid=UID;pulling=true;let last=store.get(K('pull'))||'1970-01-01T00:00:00Z',changed=false,failed=false;
  const map=new Map(TX.map(t=>[t.id,t]));
  try{for(;;){
    const {data,error}=await sb.from('transactions').select('*').gt('synced_at',last).order('synced_at').limit(1000);
    if(error){failed=true;break}
    for(const r of data){const t=fromRow(r),l=map.get(t.id);if(!l||t.updated_at>l.updated_at){map.set(t.id,t);changed=true}last=r.synced_at}
    if(data.length<1000)break;
  }}catch(e){failed=true}
  pulling=false;if(uid!==UID)return;
  if(changed){
    // keep anything edited on this phone while the download was running
    for(const t of TX){const m=map.get(t.id);if(!m||t.updated_at>m.updated_at)map.set(t.id,t)}
    TX=[...map.values()];reindex();saveLocal();refresh()}
  if(failed){setCloud('err');return}
  store.set(K('pull'),last);setCloud('ok');
  if(justLogged){justLogged=false;toast(LIVE.length?'तुमचे '+LIVE.length+' जुने हिशोब परत आले ✓':'लॉगिन झाले ✓')}
  push();
}
function sync(){if(sb&&UID!=='guest')pull()}
function setUser(u){
  const id=u?u.id:'guest';EMAIL=u?(u.email||''):'';PROFILE=(u&&u.user_metadata)||{};
  if(id===UID)return;
  let guest=[];
  if(u){try{guest=JSON.parse(store.get('dh.tx.guest')||'[]')}catch(e){}}
  UID=id;loadLocal();
  if(guest.length){ // हिशोब लिहिलेला होता आणि मग लॉगिन केले: तो या खात्यात घ्या
    const have=new Set(TX.map(t=>t.id));
    for(const t of guest)if(t&&t.id&&!have.has(t.id)){TX.push(t);dirty.add(t.id)}
    reindex();if(saveLocal()){store.del('dh.tx.guest');store.del('dh.dirty.guest')}
  }
  cloud=u?'wait':'off';
}
function setCloud(s){if(cloud!==s){cloud=s;if(tab==='set'||tab==='home')refresh()}}

/* ---------- history ---------- */
const F={q:'',period:'all',type:'all',cat:'all',from:'',to:'',show:150};
function inPeriod(d){
  const td=today();
  switch(F.period){
    case 'today':return d===td;
    case 'yest':return d===addDays(td,-1);
    case 'week':{const wd=(parse(td).getDay()+6)%7,s=addDays(td,-wd);return d>=s&&d<=addDays(s,6)}
    case 'month':return d.slice(0,7)===td.slice(0,7);
    case 'last':return d.slice(0,7)===shiftMonth(td.slice(0,7),-1);
    case 'custom':return(!F.from||d>=F.from)&&(!F.to||d<=F.to);
  }return true}
function filtered(){
  const q=F.q.trim().toLowerCase(),qn=q.replace(/[₹,\s]/g,'');
  return LIVE.filter(t=>{
    if(F.type!=='all'&&t.type!==F.type)return false;
    if(F.cat!=='all'&&t.category!==F.cat)return false;
    if(!inPeriod(t.date))return false;
    if(!q)return true;
    const hay=[t.purpose,t.category,TYPE[t.type],t.date,fmtDate(t.date),dayName(t.date),t.amount.toLocaleString('en-IN')].join(' ').toLowerCase();
    return hay.includes(q)||(/^\d/.test(qn)&&String(t.amount).includes(qn))})}
function renderList(){
  document.querySelectorAll('#periods .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===F.period));
  $('#custom').hidden=F.period!=='custom';
  const list=filtered(),box=$('#list');
  if(!LIVE.length){box.innerHTML='<div class="empty">अजून कोणताही हिशोब नाही.</div><button class="btn primary big" data-act="add">+ पहिला हिशोब नोंदवा</button>';return}
  if(!list.length){box.innerHTML='<div class="empty">या निवडीत हिशोब सापडला नाही.</div>';return}
  const s=totals(list),yr=today().slice(0,4);
  let h='<div class="count">'+list.length+' हिशोब · घेतले '+rupee(s.tin)+' · दिले '+rupee(s.tout)+'</div>';
  const shown=list.slice(0,F.show);let i=0;
  while(i<shown.length){
    const d=shown[i].date,rows=[];while(i<shown.length&&shown[i].date===d)rows.push(shown[i++]);
    const dd=parse(d),net=totals(list.filter(t=>t.date===d)).net;
    h+='<div class="day"><h3>'+DAYS[dd.getDay()]+', '+dd.getDate()+' '+MONTHS[dd.getMonth()]+(d.slice(0,4)!==yr?' '+d.slice(0,4):'')+'</h3><div class="rows">';
    for(const t of rows){const c=t.type==='TAKEN'?'in':'out';
      h+='<button class="hrow" data-act="edit" data-id="'+esc(t.id)+'"><span class="pill '+c+'">'+TYPE[t.type]+'</span><span class="why">'+esc(t.purpose||t.category)+(t.purpose&&t.purpose!==t.category?'<small>'+esc(t.category)+'</small>':'')+'</span><span class="a '+c+'">'+rupee(t.amount)+'</span></button>'}
    h+='</div><div class="net"><span>दिवसाचा निव्वळ हिशोब</span><b>'+rupee(net)+'</b></div></div>';
  }
  if(list.length>F.show)h+='<button class="btn wide" data-act="more">आणखी दाखवा</button>';
  box.innerHTML=h;
}
$('#periods').innerHTML=PERIODS.map(p=>'<button class="chip" data-p="'+p[0]+'" aria-pressed="false">'+p[1]+'</button>').join('');

/* ---------- export / backup ---------- */
function csvFor(list){
  const rows=list.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.created_at<b.created_at?-1:1));
  const cell=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  let bal=0;const out=[['दिनांक','वार','प्रकार','रक्कम','कशासाठी','Category','शिल्लक'].join(',')];
  for(const t of rows){bal+=Math.round(t.amount*100)*(t.type==='TAKEN'?1:-1);
    out.push([t.date.split('-').reverse().join('-'),dayName(t.date),TYPE[t.type],t.amount,cell(t.purpose),cell(t.category),bal/100].join(','))}
  return '﻿'+out.join('\r\n')}
function saveFile(name,data,title){
  if(window.HishobAndroid){ // Android app: फाईल थेट Downloads मध्ये
    if(window.HishobAndroid.saveFile(name,data))toast('फाईल Downloads मध्ये सेव्ह झाली ✓');else textBox(title+' — हा मजकूर कॉपी करून ठेवा',data.replace(/^\ufeff/,''));return}
  try{
    const url=URL.createObjectURL(new Blob([data],{type:/\.csv$/.test(name)?'text/csv;charset=utf-8':'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);toast('फाईल सेव्ह झाली ✓');
  }catch(e){textBox(title+' — हा मजकूर कॉपी करून ठेवा',data.replace(/^\ufeff/,''))}}
function exportMonth(mk){const l=LIVE.filter(t=>t.date.slice(0,7)===mk);if(!l.length)return toast('या महिन्यात हिशोब नाही.');saveFile('dainandin-hishob-'+mk+'.csv',csvFor(l),fmtMonth(mk))}
$('#restore').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result),arr=Array.isArray(j)?j:j.transactions;if(!Array.isArray(arr))throw 0;
    const map=new Map(TX.map(t=>[t.id,t])),ids=[];let n=0;
    for(const t of arr){if(!t||!t.id||!validDate(t.date)||!(t.amount>0)||!TYPE[t.type])continue;const l=map.get(t.id);
      if(!l||String(t.updated_at)>String(l.updated_at)){map.set(t.id,t);ids.push(t.id);n++}}
    TX=[...map.values()];commit(ids);toast(n+' हिशोब परत आले ✓');
  }catch(x){toast('ही फाईल वाचता आली नाही.')}};
  r.readAsText(f)});

function askPin(title,cancel,err){pinBuf='';drawDots();$('#lock-title').textContent=title;$('#lock-err').textContent=err||'';$('#lock-cancel').hidden=!cancel;$('#lock').hidden=false;return new Promise(r=>{pinRes=r})}

  if(!(await confirmBox('तुमचे खाते आणि सर्व हिशोब कायमचे हटवले जातील. हे परत आणता येणार नाही. हटवायचे का?','कायमचे हटवा',true)))return;
  const uid=UID;
  try{const {error}=await sb.rpc('delete_my_account');if(error)throw error}catch(e){return toast('खाते हटवता आले नाही. पुन्हा प्रयत्न करा.')}
  for(const k of ['tx','dirty','pull'])store.del('dh.'+k+'.'+uid);
  await sb.auth.signOut({scope:'local'});toast('खाते हटवले ✓');
}

/* ---------- start ---------- */
if(sb){
  try{const {data}=await sb.auth.getSession();setUser(data.session?data.session.user:null)}catch(e){}
  sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>{
    const before=UID;setUser(session?session.user:null);
    if(UID!==before){refresh();sync();if(UID==='guest')openAuth(true);else $('#auth').hidden=true}
    if(ev==='PASSWORD_RECOVERY')askNewPassword();
  },0)});
  window.addEventListener('online',sync);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
}
if(UID==='guest')loadLocal();
if(store.get('dh.pin'))unlock();
go('home');
if(sb&&UID==='guest')openAuth(true);
sync();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
