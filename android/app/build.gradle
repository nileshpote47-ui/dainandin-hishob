plugins { id 'com.android.application' }

android {
    namespace 'app.dainandinhishob'
    compileSdk 34
    defaultConfig {
        applicationId 'app.dainandinhishob'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_FILE') ?: 'missing.jks')
            storePassword System.getenv('KS_PASS') ?: ''
            keyAlias 'hishob'
            keyPassword System.getenv('KS_PASS') ?: ''
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { checkReleaseBuilds false; abortOnError false }
}
